name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  # Uploads the checked site to Cloudflare Pages. Runs only on main and only
  # once the CLOUDFLARE_API_TOKEN repository secret exists (see README).
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 81b79b1e00dfc12b2bef0a7452fdbab9
    steps:
      - name: Skip when no Cloudflare token is set
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN secret not set; skipping deploy."
      - uses: actions/download-artifact@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          name: site
          path: dist
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
      - name: Create the Pages project if it doesn't exist yet
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages project create palworld-breeding --production-branch=main || echo "Project already exists."
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy dist --project-name=palworld-breeding --branch=main --commit-dirty=true
